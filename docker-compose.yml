services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: uvicorn srag.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    networks:
      - srag_network
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:8080"
    profiles:
      - production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - srag_network
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  frontend-dev:
    profiles:
      - dev
    image: node:22-slim
    network_mode: host
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy

  e2e-runner:
    profiles:
      - e2e
    image: node:22-slim
    networks:
      - srag_network
    volumes:
      - ./frontend:/app
      - playwright-cache:/ms-playwright
    working_dir: /app
    environment:
      - BASE_URL=http://frontend:8080
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    command:
      - sh
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq libglib2.0-0 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2
        npm install --legacy-peer-deps
        npx playwright install chromium
        node capture_panels.mjs
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

networks:
  srag_network:
    driver: bridge

volumes:
  playwright-cache:

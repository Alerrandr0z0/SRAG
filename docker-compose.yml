services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: uvicorn srag.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app/src

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

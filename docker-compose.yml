services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: uv run uvicorn srag.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed
    environment:
      - PYTHONPATH=/app/src

  jupyter:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: >
      uv run jupyter-lab --no-browser --ip 0.0.0.0 --port 8888
      --allow-root
      --NotebookApp.token='' --NotebookApp.password=''
      --ServerApp.base_url=/lab/
      --ServerApp.allow_origin='*'
      --ServerApp.tornado_settings="{\"headers\":{\"Content-Security-Policy\":\"frame-ancestors *\"}}"
    ports:
      - "8888:8888"
    volumes:
      - ./data/processed:/app/data/processed
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONPATH=/app/src

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - jupyter

[project]
name = "srag"
version = "0.1.0"
description = "SRAG outbreak prediction tools using data analysis and machine learning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "requests>=2.32",
    "pydantic>=2.7",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "sqlalchemy>=2.0.48",
    "python-multipart>=0.0.22",
    "pyarrow>=18.0",
    "logfire[fastapi,sqlalchemy]>=4.31.0",
    "httpx>=0.28.1",
    "lifelines>=0.30.3",
    "duckdb>=1.5.1",
    "prophet>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=4.1",
    "bandit>=1.8.3",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.ruff]
target-version = "py314"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
]

[tool.ruff.lint.per-file-ignores]
"src/srag/api/main.py" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "B008",
    "B905",
    "D103",
    "E501",
    "E741",
    "F841",
    "N806",
    "RUF005",
]
"tests/integration/test_api.py" = [
    "ANN001",
    "ANN201",
    "D103",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["srag"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lifelines.*", "prophet.*", "logfire.*", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pre_commit.*", "bandit.*"]
ignore_missing_imports = true

[tool.pre-commit]
default_language_version = { python = "python3.14" }

[tool.mutmut]
paths_to_mutate = ["src"]
backup = false
runner = "PYTHONPATH=. uv run pytest -x --ignore=tests/integration"
diff_line_numbers = true
global = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short --ignore=tests/integration"
norecursedirs = ["mutants"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external data sources",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "bandit>=1.8.3",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=4.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "mutmut>=3.0.0",
    "ruff>=0.15.5",
    "graphifyy>=0.7.11",
    "jupyterlab>=4.5.5",
]
